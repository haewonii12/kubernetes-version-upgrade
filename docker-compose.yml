services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    # 이미지 이름을 고정해둬야 폐쇄망 반입 시 `docker save/load` 대상을 명확히
    # 지정할 수 있다 (README "폐쇄망 배포 방법" 참고).
    image: k8s-upgrade-backend:latest
    ports:
      - "8000:8000"
    environment:
      - UPGRADE_AGENT_CORS_ALLOW_ORIGINS=["http://localhost:3000"]
      # kubectl-ai 커맨드는 Dockerfile ENV 기본값(이미지에 구워넣은 바이너리)을 그대로
      # 쓴다 — 별도 경로의 바이너리를 쓰려면 여기서 재정의하면 됨.
    volumes:
      - backend-var:/app/backend/var
      # 폐쇄망 운영 시 rag/documents 를 새 문서로 갱신하면 컨테이너 재기동만으로 반영됩니다.
      - ./rag/documents:/app/rag/documents:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: k8s-upgrade-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-var:
