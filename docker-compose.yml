services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - UPGRADE_AGENT_CORS_ALLOW_ORIGINS=["http://localhost:3000"]
    volumes:
      - backend-var:/app/backend/var
      # 폐쇄망 운영 시 rag/documents 를 새 문서로 갱신하면 컨테이너 재기동만으로 반영됩니다.
      - ./rag/documents:/app/rag/documents:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-var:
